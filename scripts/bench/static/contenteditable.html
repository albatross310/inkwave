<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>contenteditable floor</title>
<style>
  html,body{margin:0;height:100%;font:16px/1.5 Georgia,serif}
  #ed{min-height:100vh;box-sizing:border-box;padding:24px;outline:none;
      font:18px/1.6 Georgia,serif;max-width:820px;margin:0 auto}
  #ed p{margin:0 0 1em}
</style>
</head>
<body>
<div id="ed" contenteditable="true" spellcheck="false"></div>
<script>
  const ed = document.getElementById('ed')
  window.__region = ed
  window.__sig = () => ed.textContent.length
  // paras: array of paragraph strings. Caret goes at the start of the MIDDLE paragraph.
  window.__setDoc = (paras) => {
    ed.innerHTML = paras.map(p => '<p>' + p.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</p>').join('')
    const ps = ed.querySelectorAll('p')
    const midP = ps[Math.floor(ps.length / 2)]
    const tn = midP.firstChild || midP
    const r = document.createRange()
    // caret in the MIDDLE of the middle paragraph's text
    const off = tn.nodeType === 3 ? Math.floor(tn.textContent.length / 2) : 0
    r.setStart(tn, off); r.collapse(true)
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r)
    ed.focus()
    // re-assert selection after focus
    sel.removeAllRanges(); sel.addRange(r)
  }
</script>
</body>
</html>
