<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>textarea floor</title>
<style>
  html,body{margin:0;height:100%;font:16px/1.5 Georgia,serif}
  #ta{width:100vw;height:100vh;box-sizing:border-box;padding:24px;border:0;
      font:18px/1.6 Georgia,serif;resize:none;outline:none}
</style>
</head>
<body>
<textarea id="ta" spellcheck="false"></textarea>
<script>
  // Content signature = value length + a cheap tail hash. The harness reads window.__sig()
  // each frame to detect the applied change (identical polling method across all editors).
  const ta = document.getElementById('ta')
  window.__region = ta
  window.__sig = () => ta.value.length
  // Inject a document (plain text) and put the caret in the MIDDLE.
  window.__setDoc = (text) => {
    ta.value = text
    const mid = Math.floor(text.length / 2)
    ta.focus()
    ta.setSelectionRange(mid, mid)
  }
</script>
</body>
</html>
