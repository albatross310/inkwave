<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { width: 300px; font-family: Georgia, serif; color: #3a3a3a; background: #fbf5ec; }
    .h { padding: 10px 12px; border-bottom: 1px solid #e7e0d4; font-size: 13px; color: #5c2d8a; }
    .b { padding: 12px; }
    button#cap { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #5c2d8a; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }
    button#cap:disabled { opacity: .5; }
    .s { margin-top: 10px; font-size: 12px; min-height: 16px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    .hint { margin-top: 8px; font-size: 11px; color: #8a8378; }
    /* "Already in library" banner */
    #already { display: none; margin-top: 10px; padding: 7px 10px; border-radius: 8px; background: rgba(92,45,138,0.08); border: 1px solid rgba(92,45,138,0.2); }
    #already .al-row { display: flex; align-items: center; justify-content: space-between; }
    #already .al-label { font-size: 11px; color: #5c2d8a; }
    #already .al-type { font-size: 10px; color: #9b5ccc; }
    #showPanel { background: none; border: 1px solid rgba(92,45,138,0.4); border-radius: 6px; color: #5c2d8a; font-size: 10px; padding: 2px 8px; cursor: pointer; font-family: inherit; flex-shrink: 0; }
    #showPanel:hover { background: rgba(92,45,138,0.08); }
    #already .al-missing { margin-top: 5px; font-size: 10px; color: #92400e; background: #fef3c7; padding: 4px 7px; border-radius: 5px; }
    /* Fields panel */
    #fields { display: none; margin-top: 12px; border-top: 1px solid #e7e0d4; padding-top: 10px; }
    #fields h3 { font-size: 11px; font-weight: normal; color: #8a8378; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .field { display: flex; flex-direction: column; gap: 2px; padding: 5px 6px; border-radius: 6px; cursor: default; transition: background .15s; }
    .field:hover, .field:focus { background: rgba(92,45,138,.08); outline: none; }
    .field-label { font-size: 10px; color: #9b5ccc; text-transform: uppercase; letter-spacing: .05em; }
    .field-value { font-size: 12px; color: #3a3a3a; }
    .field-badge { font-size: 9px; color: #8a8378; margin-top: 1px; }
    .badge-crossref { color: #166534; }
    .badge-ai { color: #92400e; }
  </style>
</head>
<body>
  <div class="h">Inkwave — capture citation</div>
  <div class="b">
    <button id="cap">Capture this page</button>
    <div class="s" id="status"></div>

    <!-- shown when this page is already in the queue -->
    <div id="already">
      <div class="al-row">
        <div>
          <div class="al-label">Already captured</div>
          <div class="al-type" id="alType"></div>
        </div>
        <button id="showPanel">Show on page</button>
      </div>
      <div class="al-missing" id="alMissing" style="display:none"></div>
    </div>

    <div id="fields">
      <h3>Captured fields</h3>
      <div id="fieldList"></div>
    </div>
    <div class="hint" id="hint">Journal articles (DOI) and arXiv preprints capture instantly. Open your Inkwave tab to see them land in your library.</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
